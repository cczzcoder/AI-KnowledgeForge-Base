server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: knowledge-forge-ai
  config:
    import: optional:classpath:llm.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/knowledgeforge
    username: kf_user
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        charSet: UTF8

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: knowledge-forge

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    '[com.knowledgeforge]': DEBUG
    '[org.springframework.ai]': DEBUG
    '[org.springframework.jdbc.core]': DEBUG
    '[org.springframework.jdbc.core.JdbcTemplate]': DEBUG
    '[org.springframework.jdbc.core.StatementCreatorUtils]': TRACE

knowledgeforge:
  extraction:
    max-chunks: 10
    rate-limit-ms: 500