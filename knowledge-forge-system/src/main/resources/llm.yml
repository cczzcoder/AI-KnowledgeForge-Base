spring:
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
          temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
        vector-table-name: vector_store

knowledgeforge:
  ai:
    embedding:
      provider: ${AI_EMBEDDING_PROVIDER:openai-compatible}
      base-url: ${AI_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
      api-key: ${AI_EMBEDDING_API_KEY:${AI_API_KEY}}
      model: ${AI_EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
      dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
