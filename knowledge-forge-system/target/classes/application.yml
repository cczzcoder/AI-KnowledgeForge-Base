server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: knowledge-forge-ai
  config:
    import: optional:classpath:llm.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/knowledgeforge
    username: kf_user
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        charSet: UTF8

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: knowledge-forge

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    '[com.knowledgeforge]': DEBUG
    '[org.springframework.ai]': DEBUG
    '[org.springframework.jdbc.core]': DEBUG
    '[org.springframework.jdbc.core.JdbcTemplate]': DEBUG
    '[org.springframework.jdbc.core.StatementCreatorUtils]': TRACE

knowledgeforge:
  extraction:
    max-chunks: 10
    rate-limit-ms: 500
  conversation:
    retention-days: 30
    remind-days-before: 7
    cleanup-cron: "0 0 3 * * *"
  chat:
    context:
      max-chars: 12000
      max-chunks: 8
      max-chunks-per-document: 3
      source-snippet-max-chars: 150
      high-confidence:
        min-evidence-hits: 2
        vector-similarity-threshold: 0.9
        vector-hybrid-score-threshold: 0.011
        keyword-score-threshold: 0.28
        keyword-hybrid-score-threshold: 0.0115
        graph-score-threshold: 0.9
        graph-hybrid-score-threshold: 0.0105
    credibility:
      similarity-weight: 0.4
      freshness-weight: 0.2
      diversity-weight: 0.2
      history-weight: 0.2
      freshness-decay-days: 90
    extraction:
      auto-extract-max-cards: 3
  retrieval:
    vector:
      similarity-threshold: 0.3
    keyword:
      fallback-score: 0.1
    hybrid:
      rrf:
        k: 60.0
      weights:
        vector: 0.7
        keyword: 0.3
        graph: 0.15
      thresholds:
        min-hybrid-score: 0.0114
        min-evidence-hits: 2
      adjacent:
        chunk-window: 1
        max-adjacent-chunks: 3
        max-adjacent-chunks-per-anchor: 1
