spring:
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-ai/DeepSeek-V3.2}
          temperature: 0.7
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1024
        vector-table-name: vector_store