services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kf-postgres
    environment:
      POSTGRES_DB: knowledgeforge
      POSTGRES_USER: kf_user
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Please set PG_PASSWORD in your local .env file}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kf_user -d knowledgeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kf-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Please set MINIO_ACCESS_KEY in your local .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Please set MINIO_SECRET_KEY in your local .env file}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  minio_data:
